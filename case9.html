<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASYA.KOM — Лендинг AI-компании</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="site-subpage">
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="img/errow_2.png" alt="Arrow" class="logo-arrow logo-arrow-left">
                    <a href="index.html" class="nav-link">ASYA.KOM</a>
                    <img src="img/errow_2.png" alt="Arrow" class="logo-arrow logo-arrow-right">
                </div>
                <button class="burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="nav nav-dropdown" id="mobile-menu">
                    <a href="about.html" class="nav-link">Контакты</a>
                    <a href="about.html" class="nav-link">О нас</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero hero--with-embed-preview">
        <div class="container">
            <div class="hero-content">
                <div class="hero-icon"><img src="img/errow_1.png" alt="Arrow" class="hero-icon-img"></div>
                    <div class="hero-label">КОМПЛЕКСНОЕ РЕШЕНИЕ</div>
                <h1 class="hero-title">Лендинг AI-компании</h1>
                <img src="img/15.png" alt="Line" class="hero-line">
                    <p class="hero-subtitle">Промо-сайт · UX/UI</p>
                <img src="img/15.png" alt="Line" class="hero-line">
                <div class="hero-cta">
                       <button class="cta-button">
                           <img src="img/1.jpg" alt="Profile" class="cta-avatar">
                           <div class="cta-text">
                               <div class="cta-line1">Забронируйте звонок</div>
                               <div class="cta-line2">Неформальный чат</div>
                           </div>
                       </button>
                </div>
            </div>
            <div class="hero-case-previews">
                <div class="hero-case-preview" aria-label="Экраны макета">
                    <div class="site-preview-frame site-preview-frame--image-scroll">
                        <div class="site-preview-frame__scroll" tabindex="0" role="region" aria-label="Прокрутка склейки экранов презентации">
                            <img src="img/case9-pink/landing-scroll-preview.png" width="1024" height="1899" alt="Склейка экранов презентации: hero на мониторе, адаптивные блоки, контакты" decoding="async" loading="lazy">
                        </div>
                    </div>
                    <p class="site-preview-meta hero-case-preview__hint">Экраны из презентации — листайте внутри рамки.</p>
                </div>
            </div>
            <div class="hero-blobs" aria-hidden="true">
                <span class="hero-blob hero-blob--violet hero-blob--1"></span>
                <span class="hero-blob hero-blob--mint hero-blob--2"></span>
                <span class="hero-blob hero-blob--violet hero-blob--3"></span>
                <span class="hero-blob hero-blob--mint hero-blob--4"></span>
                <span class="hero-blob hero-blob--violet-soft hero-blob--5"></span>
            </div>
        </div>
    </section>

    <!-- Hero Section Duplicate -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-icon"><img src="img/errow_1.png" alt="Arrow" class="hero-icon-img"></div>
                <div class="hero-cta">
                       <button class="cta-button">
                           <img src="img/1.jpg" alt="Profile" class="cta-avatar">
                           <div class="cta-text">
                               <div class="cta-line1">Забронируйте звонок</div>
                               <div class="cta-line2">Неформальный чат</div>
                           </div>
                       </button>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
